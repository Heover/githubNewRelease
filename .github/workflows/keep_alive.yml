name: 仓库保活

# GitHub 会在仓库 60 天无活动后禁用定时工作流 (schedule)。
# 此工作流每约 15 天自动提交一次时间戳，防止仓库被视为"不活跃"。

on:
  schedule:
    # 北京时间每月 1 日和 16 日 03:00（间隔约 15 天）
    - cron: "0 19 1,16 * *"
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新时间戳（保活提交）
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          echo "保活时间戳已更新: $(cat .keepalive)"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet || (
            git commit -m "chore: keep-alive $(date -u +'%Y-%m-%d')" &&
            git push
          )
